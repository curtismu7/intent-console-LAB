name: intent-console-lab

services:
  intent-console-lab:
    restart: unless-stopped
    build: .
    ports:
      - "127.0.0.1:${HOST_PORT:-7825}:7825"
    environment:
      PORT: "7825"
      # The container must listen on all interfaces; the publish above is loopback only.
      INTC_BIND: 0.0.0.0
      SHELF_URL: ${SHELF_URL:-http://127.0.0.1:4400}
      LAB_ALLOWED_HOSTS: ${LAB_ALLOWED_HOSTS:-intent-console-lab.local.ping-devops.com}
      # Start mode. Mock is the default. Real follows the gateway keys (shared settings file, env_file below);
      # INTC_MODE_REAL=1 alone still enables the Real switch as a legacy fallback.
      MODE: ${INTC_MODE:-}
      INTC_MODE_REAL: ${INTC_MODE_REAL:-}
    # Real mode needs the owner-set AI Gateway endpoint + bearer. The shared settings file is mounted via
    # env_file (values become container env; the server reads them from there, never from a browser value).
    # The bearer is write-only: never returned by any API, never logged.
    env_file:
      - path: ${STANDALONE_ENV:-/Users/cmuir/Development/.env}
        required: false
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7825/api/health').then(r=>r.json()).then(j=>process.exit(j.schema==='demo-health/1'&&j.state==='ready'?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      start_period: 5s
      start_interval: 2s
      timeout: 5s
      retries: 3
